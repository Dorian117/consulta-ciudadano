<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Códigos de barras de prueba</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --papel: #edeae5; --linea: #d8d2c9; --tinta: #2b2421; --suave: #6a5f57; --granate: #5e1f2b; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1.5rem; background: #fff; color: var(--tinta); font-family: Helvetica, Arial, sans-serif; }
    h1 { font-family: Garamond, 'EB Garamond', Georgia, serif; font-style: italic; color: var(--granate); margin: 0 0 0.25rem; }
    p.intro { margin: 0 0 1.25rem; color: var(--suave); max-width: 70ch; }
    .hoja { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
    .tarjeta { border: 1px solid var(--linea); padding: 0.9rem; text-align: center; break-inside: avoid; }
    .tarjeta svg { max-width: 100%; height: auto; }
    .nombre { font-weight: 600; margin: 0.25rem 0 0; }
    .esperado { margin: 0.15rem 0 0; font-size: 0.9rem; color: var(--suave); }
    .esperado b { color: var(--granate); }
    @media print { body { padding: 0; } @page { size: A4; margin: 12mm; } }
  </style>
</head>
<body>
  <h1>Códigos de barras de prueba</h1>
  <p class="intro">Imprima esta hoja y escanee cada código con la app móvil. Cada tarjeta indica el resultado esperado.
    Los códigos son Code 128 con una identificación de prueba que emula la cédula.</p>
  <div class="hoja" id="hoja"></div>

  <script src="vendor/JsBarcode.all.min.js"></script>
  <script>
    // Ciudadanos de prueba que existen en la base y dos identificaciones que NO existen.
    const CASOS = [
      { cedula: '1000000001', nombre: 'Ana Maria Prueba Uno', esperado: 'No requerido' },
      { cedula: '1000000002', nombre: 'Carlos Prueba Dos', esperado: 'Requerido' },
      { cedula: '1000000003', nombre: 'Laura Prueba Tres', esperado: 'No requerido' },
      { cedula: '1000000004', nombre: 'Jorge Prueba Cuatro', esperado: 'Requerido' },
      { cedula: '3000000001', nombre: 'No existe en la base', esperado: 'No encontrado' },
      { cedula: '3000000002', nombre: 'No existe en la base', esperado: 'No encontrado' },
    ];
    const hoja = document.getElementById('hoja');
    for (const c of CASOS) {
      const t = document.createElement('div');
      t.className = 'tarjeta';
      t.innerHTML = '<svg></svg><p class="nombre"></p><p class="esperado">Resultado esperado: <b></b></p>';
      t.querySelector('.nombre').textContent = c.nombre;
      t.querySelector('b').textContent = c.esperado;
      hoja.appendChild(t);
      JsBarcode(t.querySelector('svg'), c.cedula, { format: 'CODE128', width: 2, height: 80, fontSize: 18, margin: 10 });
    }
  </script>
  <!--
    1) Los codigos son lineales Code 128, no el PDF417 binario de la cedula real: el proyecto es academico y las
       identificaciones impresas emulan la cedula (decision de Sergio, ver docs/PENDIENTES.md).
    2) JsBarcode se incluye en docs/vendor (MIT) para poder imprimir sin internet. Dibuja cada codigo como SVG,
       que se imprime nitido a cualquier tamano.
    3) Las cuatro primeras identificaciones son los ciudadanos de prueba de la base (dos Requerido y dos No requerido).
       Si se borran de la base, la prueba backend/src/test/hoja.test.ts falla para avisar que la hoja quedo desactualizada.
       Las dos ultimas no existen: la app debe mostrar "No encontrado".
  -->
</body>
</html>
